[project]
name = "it-security-digest"
version = "0.1.0"
description = "AI-powered IT and cybersecurity news digest"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "feedparser==6.0.14",
    "jinja2==3.1.6",
    "python-docx==1.2.0",
    "gigachat==0.2.3",
    "greenlet>=3.5.6",
    "openai>=3.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
